{% extends 'shop/basic.html' %}

{% block title %}Product Chart Analytics - KR4U{% endblock %}

{% block body %}
<div class="container mt-5">
    <h2 class="mb-4">Product Category Overview</h2>
    <div class="card shadow-sm p-4">
        <canvas id="categoryChart" height="120"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    const labels = {{ chart_labels|safe }};
    const dataValues = {{ chart_data|safe }};

    const data = {
        labels: labels,
        datasets: [{
            label: 'Products per Category',
            data: dataValues,
            backgroundColor: [
                'rgba(54, 162, 235, 0.6)',
                'rgba(255, 99, 132, 0.6)',
                'rgba(255, 206, 86, 0.6)',
                'rgba(75, 192, 192, 0.6)',
                'rgba(153, 102, 255, 0.6)'
            ],
            borderColor: [
                'rgba(54, 162, 235, 1)',
                'rgba(255, 99, 132, 1)',
                'rgba(255, 206, 86, 1)',
                'rgba(75, 192, 192, 1)',
                'rgba(153, 102, 255, 1)'
            ],
            borderWidth: 1
        }]
    };

    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: data,
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>
{% endblock %}
